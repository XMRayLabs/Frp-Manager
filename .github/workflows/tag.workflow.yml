name: Version Release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "24"

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - id: version
        name: Validate version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${{ inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          raw="${raw:-1.0.0}"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $raw" >&2
            exit 1
          fi
          base="${version%%-*}"
          IFS=. read -r major minor patch <<< "$base"
          version_code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          echo "release_tag=$raw" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

  build-core:
    name: Build core binaries
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install Go dependencies
        run: |
          go mod download
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Compile release binaries
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          bash ./build.sh

      - name: Verify embedded frontend assets
        run: test -d cmd/frpp/out && find cmd/frpp/out -type f | grep -q .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS-core.txt

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-assets
          path: dist/*

  build-client-windows:
    name: Build Windows client UI
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          Set-Content -Path VERSION -Value $env:RELEASE_VERSION -NoNewline
          cd client-ui
          pnpm install --frozen-lockfile
          npm version $env:RELEASE_VERSION --no-git-tag-version --allow-same-version
          pnpm build:win

      - name: Collect Windows installer
        shell: pwsh
        working-directory: client-ui
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -Path release\*.exe -Destination release-assets
          $installer = Get-ChildItem release-assets -File -Filter "frp-manager-client-*-x64.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item -LiteralPath $installer.FullName -Destination release-assets\frp-manager-client-windows-x64.exe
          }
          $lines = Get-ChildItem release-assets -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" }
          $lines | Set-Content -Path release-assets\SHA256SUMS-client-windows.txt -Encoding ascii

      - name: Upload Windows client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-windows-assets
          path: client-ui/release-assets/*

  build-client-macos:
    name: Build macOS client UI
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Detect macOS signing credentials
        id: mac_signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing_ready=true
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              signing_ready=false
            fi
          done
          echo "ready=$signing_ready" >> "$GITHUB_OUTPUT"
          if [[ "$signing_ready" == "true" ]]; then
            echo "macOS packages will be signed and notarized."
          else
            echo "::warning::macOS signing credentials are incomplete. Publishing ad-hoc signed packages that require manual user approval."
          fi

      - name: Build macOS package
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          cd client-ui
          pnpm install --frozen-lockfile
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          pnpm build
          if [[ "${{ steps.mac_signing.outputs.ready }}" == "true" ]]; then
            TARGET_ARCH=amd64 pnpm prepare:core:mac
            pnpm exec electron-builder --mac --x64 --config.forceCodeSigning=true --publish never
            TARGET_ARCH=arm64 pnpm prepare:core:mac
            pnpm exec electron-builder --mac --arm64 --config.forceCodeSigning=true --publish never
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            TARGET_ARCH=amd64 pnpm prepare:core:mac
            pnpm exec electron-builder --mac --x64 --config.mac.identity=- --config.mac.notarize=false --config.forceCodeSigning=true --publish never
            TARGET_ARCH=arm64 pnpm prepare:core:mac
            pnpm exec electron-builder --mac --arm64 --config.mac.identity=- --config.mac.notarize=false --config.forceCodeSigning=true --publish never
            app_count=0
            while IFS= read -r -d '' app_path; do
              codesign --verify --deep --strict --verbose=2 "$app_path"
              codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q "Signature=adhoc"
              app_count=$((app_count + 1))
            done < <(find release -type d -name "*.app" -print0)
            if [[ "$app_count" -eq 0 ]]; then
              echo "::error::No ad-hoc signed macOS app bundle was found."
              exit 1
            fi
            for file in release/*.dmg release/*.zip; do
              [[ -f "$file" ]] || continue
              extension="${file##*.}"
              mv "$file" "${file%.*}-adhoc.${extension}"
            done
          fi
          mkdir -p release-assets
          find release -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          for arch in x64 arm64; do
            dmg="$(find release-assets -maxdepth 1 -type f -name "*-${arch}*.dmg" | head -n 1)"
            zip="$(find release-assets -maxdepth 1 -type f -name "*-${arch}*.zip" | head -n 1)"
            [[ -z "$dmg" ]] || cp "$dmg" "release-assets/frp-manager-client-macos-${arch}.dmg"
            [[ -z "$zip" ]] || cp "$zip" "release-assets/frp-manager-client-macos-${arch}.zip"
          done
          cd release-assets
          shasum -a 256 * > SHA256SUMS-client-macos.txt

      - name: Upload macOS client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-macos-assets
          path: client-ui/release-assets/*

  build-client-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --version
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Detect Android signing credentials
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing_ready=true
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              signing_ready=false
            fi
          done
          echo "ready=$signing_ready" >> "$GITHUB_OUTPUT"
          if [[ "$signing_ready" == "true" ]]; then
            echo "Android release APK will use the configured persistent signing key."
          else
            echo "::warning::Android signing credentials are incomplete. Publishing an installable debug-signed preview APK."
          fi

      - name: Build APK
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          ANDROID_SIGNING_READY: ${{ steps.android_signing.outputs.ready }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          cd client-ui
          pnpm install --frozen-lockfile
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          pnpm prepare:core:android
          pnpm build
          pnpm exec cap sync android
          cd android
          chmod +x gradlew
          if [[ "$ANDROID_SIGNING_READY" == "true" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/frp-manager-release.jks
            export ANDROID_KEYSTORE_FILE="$PWD/app/frp-manager-release.jks"
            FRP_MANAGER_VERSION="$RELEASE_VERSION" FRP_MANAGER_VERSION_CODE="$RELEASE_VERSION_CODE" ./gradlew assembleRelease
            source_apk="app/build/outputs/apk/release/app-release.apk"
            versioned_apk="frp-manager-client-${RELEASE_VERSION}-android.apk"
          else
            FRP_MANAGER_VERSION="$RELEASE_VERSION" FRP_MANAGER_VERSION_CODE="$RELEASE_VERSION_CODE" ./gradlew assembleDebug
            source_apk="app/build/outputs/apk/debug/app-debug.apk"
            versioned_apk="frp-manager-client-${RELEASE_VERSION}-android-debug.apk"
          fi
          cd ..
          mkdir -p release-assets
          cp "android/$source_apk" "release-assets/$versioned_apk"
          cp "android/$source_apk" "release-assets/frp-manager-client-android.apk"
          if [[ "$ANDROID_SIGNING_READY" != "true" ]]; then
            printf '%s\n' \
              "This Android preview APK uses an ephemeral debug signing key." \
              "A later build may require uninstalling this APK before installation." \
              > release-assets/ANDROID-BUILD-NOTICE.txt
          fi
          cd release-assets
          sha256sum * > SHA256SUMS-client-android.txt

      - name: Upload Android client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-android-assets
          path: client-ui/release-assets/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-core
      - build-client-windows
      - build-client-macos
      - build-client-android
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: frp-manager ${{ needs.prepare.outputs.version }}
          prerelease: false
          generate_release_notes: true
          files: release-assets/**

  docker:
    name: Publish Docker Hub images
    runs-on: ubuntu-latest
    needs: prepare
    env:
      KO_DOCKER_REPO: docker.io/sakurame1/frp-manager
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install Go dependencies
        run: |
          go mod download
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build frontend assets for image
        run: bash ./build.sh --platform linux --bintype full --arch amd64

      - name: Setup ko
        uses: ko-build/setup-ko@v0.9

      - name: Verify Docker Hub credentials
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: |
          echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets."
          exit 1

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: echo "${DOCKERHUB_TOKEN}" | ko login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Build and push standard image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          git tag -f "${RELEASE_TAG}" HEAD
          tags=(-t "${RELEASE_VERSION}")
          if [[ "${RELEASE_VERSION}" != *-* ]]; then
            tags+=(-t latest)
          fi
          ko build ./cmd/frpp --sbom=none --bare "${tags[@]}"

      - name: Build and push workerd image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          cp .ko.workerd.yaml .ko.yaml
          tags=(-t "${RELEASE_VERSION}-workerd")
          if [[ "${RELEASE_VERSION}" != *-* ]]; then
            tags+=(-t latest-workerd)
          fi
          ko build ./cmd/frpp --sbom=none --bare "${tags[@]}"

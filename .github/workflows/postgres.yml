name: PostgreSQL compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: frp_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FRP_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=integration-test-only dbname=frp_manager_test sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test ./models ./services/dao ./cmd/frpp/shared

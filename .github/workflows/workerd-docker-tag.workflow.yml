name: Publish workerd Docker image
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-static:
    runs-on: ubuntu-latest
    env:
      KO_DOCKER_REPO: docker.io/sakurame1/frp-manager
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${{ inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          raw="${raw:-1.0.0}"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $raw" >&2
            exit 1
          fi
          echo "release_tag=$raw" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: npm setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: npm install and build
        run: |
          cd www
          npm install -g pnpm
      - name: Install dependencies
        run: |
          go mod download
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Compile server
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          bash ./build.sh --current
      - name: Verify embedded frontend assets
        run: test -d cmd/frpp/out && find cmd/frpp/out -type f | grep -q .
      - name: Setup ko
        uses: ko-build/setup-ko@v0.9
      - name: Verify Docker Hub credentials
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: |
          echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets."
          exit 1
      - name: Build image with ko
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          git tag -f "${{ steps.version.outputs.release_tag }}" HEAD
          cp .ko.workerd.yaml .ko.yaml
          echo "${DOCKERHUB_TOKEN}" | ko login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin
          version="${{ steps.version.outputs.version }}"
          tags=(-t "${version}-workerd")
          if [[ "${version}" != *-* ]]; then
            tags+=(-t latest-workerd)
          fi
          ko build ./cmd/frpp --sbom=none --bare "${tags[@]}"

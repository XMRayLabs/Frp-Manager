name: Android ARMv7 test APK
on:
  push:
    branches: [codex/android-armv7-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          npm install -g pnpm@10
      - name: Build 32-bit ARM core
        env:
          CGO_ENABLED: '1'
          GOOS: android
          GOARCH: arm
          GOARM: '7'
        run: |
          export CC="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
          mkdir -p client-ui/android/app/src/main/jniLibs/armeabi-v7a
          go build -trimpath -buildmode=pie -ldflags "-checklinkname=0 -s -w -X github.com/Sakurame1/frp-manager/conf.gitVersion=1.1.0-armv7-test -X github.com/Sakurame1/frp-manager/conf.binaryType=client -X github.com/Sakurame1/frp-manager/conf.gitCommit=$GITHUB_SHA" -o client-ui/android/app/src/main/jniLibs/armeabi-v7a/libfrpp.so ./cmd/frppc
          file client-ui/android/app/src/main/jniLibs/armeabi-v7a/libfrpp.so
      - name: Build test APK
        run: |
          cd client-ui
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec cap sync android
          cd android
          chmod +x gradlew
          FRP_MANAGER_VERSION=1.1.0-armv7-test FRP_MANAGER_VERSION_CODE=10100 ./gradlew assembleDebug
      - name: Verify and collect APK
        run: |
          mkdir -p armv7-artifacts
          cp client-ui/android/app/build/outputs/apk/debug/app-debug.apk armv7-artifacts/frp-manager-client-android-armv7-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging armv7-artifacts/*.apk | tee armv7-artifacts/apk-info.txt
          grep "native-code: 'armeabi-v7a'" armv7-artifacts/apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose armv7-artifacts/*.apk
          printf '%s\n' 'ARMv7 32-bit test APK based on v1.1.0. Debug signed, no formal release.' 'Existing APK signed with a different key cannot be upgraded in place. Back up connection information before removing any existing installation.' > armv7-artifacts/README.txt
          cd armv7-artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frp-manager-android-armv7-test
          path: armv7-artifacts/*
          retention-days: 30

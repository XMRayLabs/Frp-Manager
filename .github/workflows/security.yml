name: Security regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  go-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Run all Go tests, including authorization regressions
        run: go test ./...
      - name: Check website authentication connection races
        run: go test -race ./pkg/websiteauth ./services/client
      - name: Check reachable dependency vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
  javascript-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@10
      - name: Check all panel dependencies and logic
        working-directory: www
        run: |
          pnpm install --frozen-lockfile
          pnpm audit
          node --test tests/*.test.mjs
      - name: Check all desktop and mobile dependencies
        working-directory: client-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm audit
          pnpm test:parser
          pnpm test:electron
      - name: Check all documentation dependencies
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm audit
          pnpm docs:build
